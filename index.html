<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PENETAS TELUR | Smart Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f111a; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(25, 28, 41, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
        .btn-gradient { background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%); transition: 0.3s; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <div>
            <h1 class="text-3xl font-bold italic text-yellow-500"><i class="fas fa-egg mr-2"></i>PENETAS TELUR</h1>
            <div id="digital-clock" class="text-xl font-bold text-blue-400 mt-1">00:00:00</div>
        </div>
        <div class="glass-card p-3 flex items-center gap-4">
            <div class="text-right"><p class="text-xs text-gray-400">Team:</p><p class="font-bold text-sm">Nazhif & Althaf</p></div>
            <div class="w-10 h-10 bg-yellow-600 rounded-full flex items-center justify-center"><i class="fas fa-users text-white"></i></div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="glass-card p-6 border-l-4 border-orange-500">
            <p class="text-gray-400 text-sm">Temperature</p>
            <h2 id="txt-suhu" class="text-4xl font-bold">0.0 <span class="text-sm text-orange-400">°C</span></h2>
        </div>
        <div class="glass-card p-6 border-l-4 border-blue-500">
            <p class="text-gray-400 text-sm">Humidity</p>
            <h2 id="txt-kelembapan" class="text-4xl font-bold">0 <span class="text-sm text-blue-400">%</span></h2>
        </div>
        <div class="glass-card p-6 border-l-4 border-purple-500">
            <div class="flex justify-between items-center mb-2">
                <span class="text-gray-400 text-xs">Relay Status:</span>
                <span id="txt-relay-status" class="text-xs font-bold text-green-400">L:OFF | K:OFF</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-gray-400 text-xs">Servo Angle:</span>
                <span id="txt-status-servo" class="text-sm font-bold text-purple-400">0° <i id="icon-servo" class="fas fa-sync-alt ml-1"></i></span>
            </div>
        </div>
    </div>

    <div class="glass-card p-6 mb-8">
        <canvas id="iotChart" height="100"></canvas>
    </div>

    <script>
        // Inisialisasi Firebase & Chart sama seperti sebelumnya...
        const firebaseConfig = { databaseURL: "https://monitoring-nazhif-dan-althaf-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function fetchData() {
            db.ref("monitoring").once("value").then((snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById("txt-suhu").innerText = parseFloat(data.suhu).toFixed(1);
                    document.getElementById("txt-kelembapan").innerText = data.kelembapan;
                    document.getElementById("txt-relay-status").innerText = `L:${data.statusLampu} | K:${data.statusKipas}`;
                    
                    const sv = data.sudutServo || 0;
                    const servoTxt = document.getElementById("txt-status-servo");
                    const servoIcon = document.getElementById("icon-servo");
                    
                    servoTxt.innerText = sv + "°";
                    if(sv == 90) {
                        servoTxt.classList.add("text-yellow-400");
                        servoIcon.classList.add("fa-spin");
                    } else {
                        servoTxt.classList.remove("text-yellow-400");
                        servoIcon.classList.remove("fa-spin");
                    }
                }
            });
        }
        setInterval(fetchData, 2000);
        setInterval(() => { document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString('id-ID'); }, 1000);
    </script>
</body>
</html>
